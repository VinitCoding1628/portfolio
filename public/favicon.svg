<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="vgShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a1a1aa" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>
    <radialGradient id="vgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </radialGradient>
    <filter id="vgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="28" fill="url(#vgGlow)" />

  <!-- Outer Dashed Orbital Ring -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" stroke-dasharray="3.5 3.5" />

  <!-- Badge Body -->
  <rect x="6" y="6" width="52" height="52" rx="13" fill="#0d0d11" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" filter="url(#vgShadow)" />

  <!-- Subtle Tech Corner Ticks -->
  <path d="M 10 16 L 10 10 L 16 10" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" fill="none" />
  <path d="M 48 10 L 54 10 L 54 16" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" fill="none" />
  <path d="M 10 48 L 10 54 L 16 54" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" fill="none" />
  <path d="M 54 48 L 54 54 L 48 54" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" fill="none" />

  <!-- VG Monogram Typography -->
  <text
    x="32"
    y="33"
    text-anchor="middle"
    dominant-baseline="central"
    fill="url(#vgShimmer)"
    font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif"
    font-size="24"
    font-weight="900"
    letter-spacing="-1.5px"
  >VG</text>
</svg>
